services:
  web:
    build: ./services/web
    image: ghcr.io/acme/web:1.8.3
    ports:
      - "127.0.0.1:8100:8080"
    env_file:
      - ./env/web.env
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 512m
    pids_limit: 200
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      retries: 3

  api:
